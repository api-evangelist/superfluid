aid: superfluid
name: Superfluid
description: 'Superfluid is a money-streaming protocol for real-time, on-chain cashflows, enabling
  continuous "payments by the second" to any wallet address across EVM networks. Built by Superfluid
  Labs, the protocol powers salaries, subscriptions, rewards, airdrops, vesting, and incentive
  distributions as programmable token streams and distribution pools. Developers integrate via
  first-party TypeScript SDKs (@superfluid-finance/sdk-core, sdk-redux), the on-chain smart
  contracts (@superfluid-finance/ethereum-contracts), an embeddable checkout Widget, and a public
  GraphQL Subgraph API served through The Graph for querying streams, pools, accounts, and token
  statistics. The protocol has streamed over $1.6B to 1.27M recipients across DeFi, SocialFi, and
  gaming use cases.'
